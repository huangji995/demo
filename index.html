<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>收藏消化助手</title>
<style>
:root{
  --bg:#f6f7f9;
  --top-bg:rgba(246,247,249,.82);
  --surface:#fff;
  --surface-2:#f0f2f5;
  --text:#1f2328;
  --text-2:#6b7280;
  --text-3:#9aa3af;
  --line:#e6e8ec;
  --accent:#4f7cff;
  --accent-soft:#eef3ff;
  --ok:#2f9e6e;
  --ok-soft:#e9f7f0;
  --warn:#b8763c;
  --warn-soft:#fdf2e7;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 24px -14px rgba(16,24,40,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115;
    --top-bg:rgba(15,17,21,.82);
    --surface:#171a20;
    --surface-2:#1e222a;
    --text:#e8eaed;
    --text-2:#9aa3af;
    --text-3:#7b8494;
    --line:#272b33;
    --accent:#7d9bff;
    --accent-soft:#1b2233;
    --ok:#4ec38d;
    --ok-soft:#16281f;
    --warn:#e0a06a;
    --warn-soft:#2a2117;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -18px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{
  position:sticky;top:0;z-index:10;
  background:var(--top-bg);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.top .wrap{padding:18px 20px 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
.sub{margin:4px 0 0;font-size:12.5px;color:var(--text-3)}
main{padding-bottom:40px}
.compose{margin:22px 0 18px}
.field{display:flex;gap:10px;align-items:center}
input[type=text]{
  flex:1;min-width:0;
  font:inherit;color:var(--text);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 14px;
  outline:none;
  box-shadow:var(--shadow);
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
input[type=text]::placeholder{color:var(--text-3)}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  font:inherit;font-size:13.5px;
  border-radius:10px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  padding:8px 14px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,opacity .18s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{cursor:not-allowed}
.btn.loading{opacity:.6;cursor:progress}
.btn.primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
  padding:11px 20px;font-weight:600;
}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.gear{font-size:12.5px;padding:6px 12px}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--text-3)}
.settings{
  margin:0 0 18px;padding:16px 16px 14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  animation:fadeInUp .22s ease both;
}
.settings-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:12px}
.settings-head strong{font-size:14px}
.settings-tip{font-size:12px;color:var(--text-3)}
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;color:var(--text-2)}
.field-row>span{width:74px;flex:none}
.field-row input{
  flex:1;min-width:0;
  font:inherit;font-size:13px;
  padding:8px 11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text);
  outline:none;
  box-shadow:none;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.field-row input::placeholder{color:var(--text-3)}
.field-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.settings-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.settings-actions .btn{padding:7px 14px}
.settings-state{font-size:12px;color:var(--text-3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:13.5px;
  padding:7px 13px;
  border-radius:9px;
  border:1px solid transparent;
  background:transparent;
  color:var(--text-2);
  cursor:pointer;
  transition:background .2s ease,color .2s ease
}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{
  font-style:normal;font-size:11.5px;line-height:1;
  padding:3px 6px;border-radius:20px;
  background:var(--surface-2);color:var(--text-3);
  transition:background .2s ease,color .2s ease
}
.tab.active .count{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:15px 16px;
  transition:transform .2s ease,box-shadow .2s ease,opacity .18s ease
}
.card:hover{transform:translateY(-1px)}
.card.leaving{opacity:0;transform:translateY(-6px) scale(.985)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list.fade .card{animation:fadeInUp .26s ease both}
.list.fade .card:nth-child(2){animation-delay:.03s}
.list.fade .card:nth-child(3){animation-delay:.06s}
.list.fade .card:nth-child(4){animation-delay:.09s}
.list.fade .card:nth-child(n+5){animation-delay:.12s}
.card-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.seq{font-variant-numeric:tabular-nums;letter-spacing:.6px;color:var(--text-2)}
.badge{font-size:11.5px;padding:2px 7px;border-radius:20px;font-weight:600}
.badge.pending{background:var(--accent-soft);color:var(--accent)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.badge.archived{background:var(--warn-soft);color:var(--warn)}
.time{margin-left:auto;font-variant-numeric:tabular-nums}
.card-title{margin:9px 0 0;font-size:15.5px;font-weight:640;line-height:1.45;word-break:break-word}
.ai-summary{
  margin-top:8px;padding:10px 12px;
  background:var(--surface-2);border-radius:10px;
  font-size:13.5px;color:var(--text-2);
  line-height:1.65;word-break:break-word;
  animation:fadeInUp .22s ease both
}
.ai-summary.loading{color:var(--text-3)}
.ai-summary.error{background:var(--warn-soft);color:var(--warn)}
.card-content{
  margin:6px 0 0;font-size:13.5px;color:var(--text-2);
  word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.card-actions .btn{font-size:13px;padding:6px 12px}
.btn.ai{color:var(--text-3);border-style:dashed}
.empty{
  padding:52px 20px;text-align:center;
  color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--line);border-radius:var(--radius);
  animation:fadeInUp .3s ease both
}
.foot{
  margin-top:34px;text-align:center;
  font-size:12px;color:var(--text-3)
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <div>
      <h1>收藏消化助手</h1>
      <p class="sub">主动投递 · 本地存储 · 用完即走</p>
    </div>
    <button class="btn gear" id="settingsToggle">AI 设置</button>
  </div>
</header>

<main class="wrap">
  <section class="compose">
    <div class="field">
      <input id="input" type="text" placeholder="粘贴链接，或写下想消化的内容…" autocomplete="off" spellcheck="false">
      <button id="submit" class="btn primary" disabled>投递</button>
    </div>
    <p class="hint">数据仅保存在本机浏览器；只有你点击「AI 提炼」时，该条内容才会发送给你自己配置的模型服务。</p>
  </section>

  <section class="settings" id="settings" hidden>
    <div class="settings-head">
      <strong>AI 提炼设置</strong>
      <span class="settings-tip">兼容 OpenAI 格式接口，配置仅存本机 localStorage</span>
    </div>
    <label class="field-row">
      <span>API 地址</span>
      <input id="cfgBase" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false">
    </label>
    <label class="field-row">
      <span>模型名称</span>
      <input id="cfgModel" type="text" placeholder="gpt-4o-mini" autocomplete="off" spellcheck="false">
    </label>
    <label class="field-row">
      <span>API Key</span>
      <input id="cfgKey" type="text" placeholder="sk-..." autocomplete="off" spellcheck="false">
    </label>
    <div class="settings-actions">
      <button class="btn primary" id="cfgSave">保存配置</button>
      <button class="btn" id="cfgClear">清空 Key</button>
      <span class="settings-state" id="cfgState"></span>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="pending">待消化<i class="count" data-count="pending">0</i></button>
    <button class="tab" data-tab="done">已消化<i class="count" data-count="done">0</i></button>
    <button class="tab" data-tab="archived">归档<i class="count" data-count="archived">0</i></button>
  </nav>

  <section class="list" id="list"></section>

  <p class="foot">数据保存在本机 localStorage，清除浏览器数据会一并清除。</p>
</main>

<script>
(function(){
  var KEY_CARDS='favorite_digester_cards';
  var KEY_META='favorite_digester_meta';
  var KEY_AI='favorite_digester_ai';
  var VERSION=1;
  var REQUEST_TIMEOUT=60000;
  var MAX_INPUT=4000;
  var SYSTEM_PROMPT='你是收藏内容消化助手。请用中文提炼这段收藏内容的要点与可用结论，2-3 句、不超过 120 字，不要客套话，直接输出结论。';
  var STATUS_TEXT={pending:'待消化',done:'已消化',archived:'归档'};
  var EMPTY_TEXT={
    pending:'还没有待消化的内容，投递第一条吧。',
    done:'还没有已消化的内容，慢慢来。',
    archived:'归档区是空的，这里存放你暂时不想处理的内容。'
  };

  var state={
    cards:[],
    meta:{seqCounter:1,version:VERSION},
    ai:{baseUrl:'',model:'',apiKey:''}
  };
  var tab='pending';

  var list=document.getElementById('list');
  var tabs=document.getElementById('tabs');
  var input=document.getElementById('input');
  var submitBtn=document.getElementById('submit');
  var settings=document.getElementById('settings');
  var settingsToggle=document.getElementById('settingsToggle');
  var cfgBase=document.getElementById('cfgBase');
  var cfgModel=document.getElementById('cfgModel');
  var cfgKey=document.getElementById('cfgKey');
  var cfgSave=document.getElementById('cfgSave');
  var cfgClear=document.getElementById('cfgClear');
  var cfgState=document.getElementById('cfgState');

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  function pad2(n){return String(n).padStart(2,'0');}
  function pad3(n){return String(n).padStart(3,'0');}
  function shorten(s,n){
    s=String(s).replace(/\s+/g,' ').trim();
    return s.length>n?s.slice(0,n)+'…':s;
  }
  function hostOf(v){
    try{
      var h=new URL(v).hostname.replace(/^www\./,'');
      return h||shorten(v,40);
    }catch(e){return shorten(v,40);}
  }
  function relTime(ts){
    ts=Number(ts)||0;
    var diff=Date.now()-ts;
    if(diff<60000)return '刚刚';
    var min=Math.floor(diff/60000);
    if(min<60)return min+'分钟前';
    var hour=Math.floor(min/60);
    if(hour<24)return hour+'小时前';
    var day=Math.floor(hour/24);
    if(day<30)return day+'天前';
    var d=new Date(ts);
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function isValidCard(c){
    return c&&typeof c==='object'&&typeof c.id==='string'&&typeof c.content==='string'
      &&STATUS_TEXT[c.status]!==undefined;
  }
  function chatEndpoint(base){
    var b=String(base).trim().replace(/\/+$/,'');
    return /\/chat\/completions$/.test(b)?b:b+'/chat/completions';
  }

  function load(){
    try{
      var rawCards=localStorage.getItem(KEY_CARDS);
      var rawMeta=localStorage.getItem(KEY_META);
      var rawAi=localStorage.getItem(KEY_AI);
      var cards=rawCards?JSON.parse(rawCards):[];
      var meta=rawMeta?JSON.parse(rawMeta):null;
      var ai=rawAi?JSON.parse(rawAi):null;
      state.cards=Array.isArray(cards)?cards.filter(isValidCard).map(function(c){
        return {
          id:c.id,
          seq:Number(c.seq)||0,
          type:c.type==='link'?'link':'text',
          content:c.content,
          title:typeof c.title==='string'&&c.title?c.title:(c.type==='link'?hostOf(c.content):shorten(c.content,40)),
          status:c.status,
          createdAt:Number(c.createdAt)||Date.now(),
          updatedAt:Number(c.updatedAt)||Number(c.createdAt)||Date.now(),
          summary:typeof c.summary==='string'?c.summary:'',
          summaryAt:Number(c.summaryAt)||0
        };
      }):[];
      state.meta=(meta&&typeof meta==='object')
        ?{seqCounter:Number(meta.seqCounter)||1,version:Number(meta.version)||VERSION}
        :{seqCounter:1,version:VERSION};
      state.ai=(ai&&typeof ai==='object')
        ?{baseUrl:String(ai.baseUrl||''),model:String(ai.model||''),apiKey:String(ai.apiKey||'')}
        :{baseUrl:'',model:'',apiKey:''};
      var maxSeq=state.cards.reduce(function(m,c){return Math.max(m,c.seq);},0);
      if(state.meta.seqCounter<=maxSeq)state.meta.seqCounter=maxSeq+1;
    }catch(e){
      state.cards=[];
      state.meta={seqCounter:1,version:VERSION};
      state.ai={baseUrl:'',model:'',apiKey:''};
    }
  }
  function save(){
    try{
      localStorage.setItem(KEY_CARDS,JSON.stringify(state.cards));
      localStorage.setItem(KEY_META,JSON.stringify(state.meta));
    }catch(e){}
  }
  function saveAI(){
    try{localStorage.setItem(KEY_AI,JSON.stringify(state.ai));}catch(e){}
  }

  function fillSettings(){
    cfgBase.value=state.ai.baseUrl;
    cfgModel.value=state.ai.model;
    cfgKey.value=state.ai.apiKey;
  }
  function openSettings(focusEmpty){
    settings.hidden=false;
    fillSettings();
    if(!focusEmpty)return;
    var target=!state.ai.baseUrl?cfgBase:(!state.ai.model?cfgModel:cfgKey);
    target.focus();
  }
  function toggleSettings(){
    if(settings.hidden){
      openSettings(false);
    }else{
      settings.hidden=true;
    }
  }
  function setConfigState(msg){cfgState.textContent=msg;}

  function cardHTML(c){
    var actions=[];
    if(c.status==='pending'){
      actions.push('<button class="btn" data-act="done">已消化</button>');
      actions.push('<button class="btn" data-act="archive">归档</button>');
    }else{
      actions.push('<button class="btn" data-act="restore">恢复</button>');
    }
    actions.push('<button class="btn ai" data-act="ai">'+(c.summary?'重新提炼':'AI 提炼')+'</button>');

    var showContent=!(c.type==='text'&&c.content.length<=40);
    var summaryHTML=c.summary
      ?'<div class="ai-summary">'+esc(c.summary)+'</div>'
      :'<div class="ai-summary" hidden></div>';

    return '<article class="card" data-id="'+esc(c.id)+'">'
      +'<div class="card-head">'
        +'<span class="seq">#'+pad3(c.seq)+'</span>'
        +'<span class="badge '+c.status+'">'+STATUS_TEXT[c.status]+'</span>'
        +'<span class="time" data-ts="'+c.createdAt+'">'+relTime(c.createdAt)+'</span>'
      +'</div>'
      +'<h3 class="card-title" title="'+esc(c.content)+'">'+esc(c.title)+'</h3>'
      +summaryHTML
      +(showContent?'<p class="card-content">'+esc(c.content)+'</p>':'')
      +'<div class="card-actions">'+actions.join('')+'</div>'
      +'</article>';
  }

  function render(){
    var counts={pending:0,done:0,archived:0};
    state.cards.forEach(function(c){counts[c.status]++;});
    tabs.querySelectorAll('.count').forEach(function(el){
      el.textContent=counts[el.dataset.count]||0;
    });
    tabs.querySelectorAll('.tab').forEach(function(el){
      el.classList.toggle('active',el.dataset.tab===tab);
    });

    var items=state.cards.filter(function(c){return c.status===tab;})
      .sort(function(a,b){return b.createdAt-a.createdAt;});

    if(!items.length){
      list.classList.remove('fade');
      list.innerHTML='<div class="empty">'+EMPTY_TEXT[tab]+'</div>';
      return;
    }
    list.innerHTML=items.map(cardHTML).join('');
    list.classList.remove('fade');
    void list.offsetWidth;
    list.classList.add('fade');
  }

  function addCard(raw){
    var v=raw.trim();
    if(!v)return;
    var isLink=/^https?:\/\/\S+$/i.test(v);
    var card={
      id:'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      seq:state.meta.seqCounter++,
      type:isLink?'link':'text',
      content:v,
      title:isLink?hostOf(v):shorten(v,40),
      status:'pending',
      createdAt:Date.now(),
      updatedAt:Date.now(),
      summary:'',
      summaryAt:0
    };
    state.cards.unshift(card);
    save();
    tab='pending';
    render();
  }

  function describeError(err){
    var msg=err&&err.message?err.message:'请求被中断';
    if(err&&err.name==='AbortError')return '请求超时（'+Math.round(REQUEST_TIMEOUT/1000)+'秒）';
    if(/failed to fetch|networkerror|load failed/i.test(msg))return '网络或跨域被拒绝，请确认该 API 允许浏览器直接访问（CORS）';
    return msg;
  }

  async function runAI(rec,cardEl,btn){
    if(!state.ai.baseUrl||!state.ai.model||!state.ai.apiKey){
      openSettings(true);
      setConfigState('请先填写并保存 API 地址、模型与 API Key');
      return;
    }
    var box=cardEl.querySelector('.ai-summary');
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();},REQUEST_TIMEOUT);

    btn.disabled=true;
    btn.classList.add('loading');
    btn.textContent='提炼中…';
    box.hidden=false;
    box.className='ai-summary loading';
    box.textContent='正在请求模型，请稍候…';

    try{
      var res=await fetch(chatEndpoint(state.ai.baseUrl),{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+state.ai.apiKey
        },
        body:JSON.stringify({
          model:state.ai.model,
          temperature:0.3,
          messages:[
            {role:'system',content:SYSTEM_PROMPT},
            {role:'user',content:rec.content.slice(0,MAX_INPUT)}
          ]
        }),
        signal:ctrl.signal
      });

      if(!res.ok){
        var detail='';
        try{detail=(await res.text()).slice(0,160);}catch(e2){}
        throw new Error('HTTP '+res.status+(detail?' · '+detail:''));
      }

      var data=await res.json();
      var text=data&&data.choices&&data.choices[0]&&data.choices[0].message
        ?data.choices[0].message.content:'';
      if(!text||!String(text).trim())throw new Error('模型返回内容为空');

      rec.summary=String(text).trim();
      rec.summaryAt=Date.now();
      save();

      box.className='ai-summary';
      box.textContent=rec.summary;
      btn.disabled=false;
      btn.classList.remove('loading');
      btn.textContent='重新提炼';
      setConfigState('提炼完成，结果已保存到本机');
    }catch(err){
      box.className='ai-summary error';
      box.textContent='提炼失败：'+describeError(err)+'（可再次点击重试）';
      btn.disabled=false;
      btn.classList.remove('loading');
      btn.textContent=rec.summary?'重新提炼':'AI 提炼';
    }finally{
      clearTimeout(timer);
    }
  }

  list.addEventListener('click',function(e){
    var btn=e.target.closest('[data-act]');
    if(!btn)return;
    var cardEl=e.target.closest('.card');
    if(!cardEl)return;
    var id=cardEl.dataset.id;
    var rec=state.cards.find(function(c){return c.id===id;});
    if(!rec)return;

    var act=btn.dataset.act;
    if(act==='ai'){
      if(btn.disabled)return;
      runAI(rec,cardEl,btn);
      return;
    }
    rec.status=act==='done'?'done':act==='archive'?'archived':'pending';
    rec.updatedAt=Date.now();
    cardEl.classList.add('leaving');
    setTimeout(function(){
      save();
      render();
    },180);
  });

  tabs.addEventListener('click',function(e){
    var t=e.target.closest('.tab');
    if(!t)return;
    tab=t.dataset.tab;
    render();
  });

  settingsToggle.addEventListener('click',toggleSettings);
  cfgSave.addEventListener('click',function(){
    state.ai={
      baseUrl:cfgBase.value.trim().replace(/\/+$/,''),
      model:cfgModel.value.trim(),
      apiKey:cfgKey.value.trim()
    };
    saveAI();
    setConfigState(state.ai.baseUrl&&state.ai.model&&state.ai.apiKey
      ?'配置已保存，可点击卡片上的「AI 提炼」'
      :'已保存，但配置不完整');
  });
  cfgClear.addEventListener('click',function(){
    state.ai.apiKey='';
    saveAI();
    fillSettings();
    setConfigState('API Key 已从本机清除');
  });
  [cfgBase,cfgModel,cfgKey].forEach(function(el){
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter')cfgSave.click();
    });
  });

  input.addEventListener('input',function(){
    submitBtn.disabled=!input.value.trim();
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&input.value.trim()){
      addCard(input.value);
      input.value='';
      submitBtn.disabled=true;
    }
  });
  submitBtn.addEventListener('click',function(){
    addCard(input.value);
    input.value='';
    submitBtn.disabled=true;
    input.focus();
  });

  setInterval(function(){
    list.querySelectorAll('.time').forEach(function(el){
      el.textContent=relTime(el.dataset.ts);
    });
  },30000);

  load();
  render();
})();
</script>
</body>
</html>
