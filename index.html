<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>收藏消化助手</title>
<style>
:root{
  /* 手绘涂鸦风 token */
  --ink:#2c2c2c;
  --paper:#fffef5;
  --paper-2:#f8f3e2;
  --rule:#cfe0f0;
  --margin:#ffb3b3;
  --marker-red:#ff6b6b;
  --marker-teal:#4ecdc4;
  --marker-yellow:#ffd93d;
  --muted:rgba(44,44,44,.5);
  --radius-sm:2px;
  --border-w:2px;
  --font-hand:"Comic Sans MS","Segoe Print","Bradley Hand",ui-rounded,"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#ece4d4;
    --paper:#201f1c;
    --paper-2:#2a2823;
    --rule:#3a3942;
    --margin:#7d4d4d;
    --muted:rgba(236,228,212,.55);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font:15px/1.62 var(--font-hand);
  background-color:var(--paper);
  background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background-color .3s ease,color .3s ease;
}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* 顶部 */
.top{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:var(--border-w) dashed var(--ink);
  transition:background-color .3s ease,border-color .3s ease;
}
.top .wrap{padding:16px 20px 14px;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{
  margin:0;font-size:20px;font-weight:700;letter-spacing:.4px;
  font-style:italic;transform:rotate(-.6deg);
}
h1::after{content:"";display:block;width:5.4em;height:6px;margin-top:2px;
  background:var(--marker-yellow);opacity:.8;border-radius:2px}
.sub{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
main{padding-bottom:150px;position:relative}
main.wrap::before{
  content:"";position:absolute;left:8px;top:8px;bottom:60px;
  width:2px;background:var(--margin);opacity:.65;
}

/* 视图切换 */
.view-switch{
  display:flex;gap:10px;flex-wrap:wrap;
  max-width:720px;margin:0 auto;
  padding:0 20px 12px;
}
.view-tab{
  font:inherit;font-size:13px;font-weight:700;
  padding:5px 14px;
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  background:var(--paper-2);color:var(--ink);
  cursor:pointer;
  transform:rotate(-.6deg);
  box-shadow:2px 2px 0 var(--marker-teal);
  transition:background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.view-tab:nth-child(even){transform:rotate(.6deg)}
.view-tab:hover{box-shadow:3px 3px 0 var(--marker-red);transform:translate(1px,1px) rotate(-.6deg)}
.view-tab:active{box-shadow:none;transform:translate(2px,2px) rotate(-.6deg)}
.view-tab:focus-visible{outline:none;box-shadow:2px 2px 0 var(--marker-teal)}
.view-tab.active{background:var(--marker-yellow);box-shadow:3px 3px 0 var(--marker-red)}

/* 投递区 */
.compose{margin:24px 0 18px;position:relative}
.field{display:flex;gap:10px;align-items:center}
input[type=text]{
  flex:1;min-width:0;
  font:inherit;color:var(--ink);
  background:var(--paper);
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  outline:none;
  box-shadow:3px 3px 0 var(--marker-teal);
  transition:box-shadow .2s ease,border-color .2s ease,color .18s ease;
}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus{border-color:var(--marker-red);box-shadow:2px 2px 0 var(--marker-yellow)}
input[type=text].sending{color:transparent;caret-color:transparent}
input[type=text].sending::placeholder{color:transparent}

/* 按钮：手账贴纸 */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:13.5px;font-weight:600;
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  background:var(--paper-2);
  color:var(--ink);
  padding:7px 13px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:2px 2px 0 var(--marker-teal);
  transition:box-shadow .2s ease,transform .2s ease,background .2s ease,opacity .2s ease;
}
.btn:hover{box-shadow:4px 4px 0 var(--marker-red);transform:translate(1px,1px) rotate(-.6deg)}
.btn:active{box-shadow:none;transform:translate(2px,2px) rotate(-.6deg)}
.btn:focus-visible{outline:none;box-shadow:2px 2px 0 var(--marker-yellow)}
.btn:disabled{cursor:not-allowed;opacity:.55;box-shadow:none;transform:none}
.btn.loading{cursor:progress}
.btn.primary{
  background:var(--ink);color:var(--paper);
  box-shadow:3px 3px 0 var(--marker-red);
  padding:10px 20px;font-weight:700;
}
.btn.primary:hover{box-shadow:5px 5px 0 var(--marker-red)}
.btn.primary:active{box-shadow:none}
.btn.primary:disabled{opacity:.45;transform:none;box-shadow:none}
.gear{font-size:12.5px;padding:7px 12px;transform:rotate(1deg)}
.gear:hover{transform:rotate(1deg) translate(1px,1px)}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}

/* 危险操作按钮 */
.btn.danger{
  color:var(--marker-red);
  border-color:var(--marker-red);
  background:rgba(255,107,107,.08);
  box-shadow:2px 2px 0 rgba(255,107,107,.35);
}
.btn.danger:hover{box-shadow:4px 4px 0 var(--marker-red);background:rgba(255,107,107,.14)}
.btn.danger:active{box-shadow:none}

/* 灵感碰撞按钮 */
.btn.link{background:rgba(78,205,196,.32);box-shadow:2px 2px 0 var(--marker-teal)}
.btn.link:hover{box-shadow:4px 4px 0 var(--marker-red)}

/* 设置面板 */
.settings{
  margin:0 0 18px;padding:16px 16px 14px;position:relative;
  background:var(--paper);
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  box-shadow:4px 4px 0 var(--marker-teal);
  animation:fadeInUp .22s ease both;
}
.settings::after{content:"";position:absolute;top:-9px;right:16px;width:60px;height:17px;
  transform:rotate(-4deg);background:rgba(255,217,61,.72);
  border-left:1px dashed rgba(44,44,44,.35);border-right:1px dashed rgba(44,44,44,.35)}
.settings-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:12px}
.settings-head strong{font-size:14px;font-style:italic}
.settings-tip{font-size:12px;color:var(--muted)}
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;color:var(--muted)}
.field-row>span{width:74px;flex:none}
.field-row input{
  flex:1;min-width:0;font:inherit;font-size:13px;
  padding:8px 11px;
  border-radius:var(--radius-sm);
  border:var(--border-w) dashed var(--ink);
  background:var(--paper-2);
  color:var(--ink);
  outline:none;
  box-shadow:none;
  transition:box-shadow .2s ease,border-color .2s ease;
}
.field-row input::placeholder{color:var(--muted)}
.field-row input:focus{border-color:var(--marker-red);box-shadow:2px 2px 0 var(--marker-yellow)}
.settings-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.settings-state{font-size:12px;color:var(--muted)}

/* 标签页 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{
  display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:13.5px;font-weight:600;
  padding:7px 13px;
  border-radius:var(--radius-sm);
  border:var(--border-w) dashed transparent;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  transform:rotate(-.5deg);
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
}
.tab:nth-child(even){transform:rotate(.5deg)}
.tab:hover{color:var(--ink);background:var(--paper-2)}
.tab.active{
  color:var(--ink);background:var(--paper);
  border-color:var(--ink);
  box-shadow:2px 2px 0 var(--marker-teal);
}
.count{
  font-style:normal;font-size:11.5px;line-height:1;
  padding:3px 6px;border-radius:var(--radius-sm);
  background:var(--paper-2);color:var(--muted);
  transition:background .2s ease,color .2s ease
}
.tab.active .count{background:var(--marker-yellow);color:var(--ink)}

/* 列表与卡片 */
.list{display:flex;flex-direction:column;gap:14px}
.card{
  --tilt:0deg;
  position:relative;
  background-color:var(--paper);
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  box-shadow:4px 4px 0 var(--marker-teal);
  padding:16px 16px 15px;
  transform:rotate(var(--tilt));
  transition:transform .22s ease,box-shadow .22s ease,opacity .2s ease;
}
.list .card:nth-child(3n){--tilt:.5deg}
.list .card:nth-child(3n+1){--tilt:-.5deg}
.card:hover{transform:rotate(var(--tilt)) translate(1px,1px);box-shadow:6px 6px 0 var(--marker-teal)}
.card::after{content:"";position:absolute;top:-9px;right:20px;width:66px;height:17px;
  transform:rotate(-4deg);background:rgba(255,217,61,.72);
  border-left:1px dashed rgba(44,44,44,.3);border-right:1px dashed rgba(44,44,44,.3)}
.card.leaving{opacity:0;transform:rotate(var(--tilt)) translateY(-6px) scale(.985)}
.card.digesting{opacity:0;transform:rotate(var(--tilt)) scale(.94);pointer-events:none}
.card.flash{animation:flashCard 1.1s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flashCard{
  0%{background-color:rgba(255,217,61,.9)}
  70%{background-color:rgba(255,217,61,.45)}
  100%{background-color:var(--paper)}
}

.card-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.seq{font-weight:700;letter-spacing:.6px;color:var(--ink)}
.badge{
  font-size:11.5px;padding:2px 8px;font-weight:700;
  border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
}
.badge.pending{background:rgba(255,217,61,.55)}
.badge.done{background:rgba(78,205,196,.5)}
.badge.archived{background:rgba(255,107,107,.42)}
.time{margin-left:auto}

.card-title{margin:10px 0 0;font-size:16px;font-weight:700;line-height:1.45;word-break:break-word;font-style:italic}
.card-title a{color:inherit;text-decoration:underline wavy var(--marker-red);
  text-decoration-thickness:1.5px;text-underline-offset:3px;
  transition:color .18s ease}
.card-title a:hover{color:var(--marker-red)}
.card-title a::after{content:"↗";font-size:11px;color:var(--muted);margin-left:4px;vertical-align:super;text-decoration:none}

/* 手账贴纸标签 */
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-chip{
  font-size:11px;font-weight:700;padding:2px 8px;white-space:nowrap;
  border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
  transform:rotate(-1deg);
}
.card-tags .tag-chip:nth-child(3n+1){background:rgba(255,217,61,.62)}
.card-tags .tag-chip:nth-child(3n+2){background:rgba(78,205,196,.5)}
.card-tags .tag-chip:nth-child(3n){background:rgba(255,107,107,.42)}

.ai-summary{
  margin-top:10px;padding:10px 12px;
  background:rgba(78,205,196,.16);
  border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--ink);line-height:1.65;word-break:break-word;
  animation:fadeInUp .22s ease both
}
.ai-summary::before{content:"AI 提炼";display:block;font-size:11px;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.ai-summary.loading{color:var(--muted)}
.ai-summary.error{background:rgba(255,107,107,.16)}

.user-note{
  margin-top:10px;padding:10px 12px;
  background:rgba(255,217,61,.34);
  border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--ink);line-height:1.65;word-break:break-word;
  transform:rotate(-.4deg);
  animation:fadeInUp .22s ease both
}
.user-note::before{content:"📝 我的笔记";display:block;font-size:11px;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}

.note-editor{margin-top:10px;animation:fadeInUp .2s ease both}
.note-input{
  width:100%;min-height:78px;
  font:inherit;font-size:13.5px;line-height:1.6;color:var(--ink);
  background:var(--paper-2);
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  padding:10px 12px;resize:vertical;outline:none;
  transition:box-shadow .2s ease,border-color .2s ease;
}
.note-input::placeholder{color:var(--muted)}
.note-input:focus{border-color:var(--marker-red);box-shadow:2px 2px 0 var(--marker-yellow)}
.note-actions{display:flex;gap:8px;margin-top:8px}

.card-content{
  margin:8px 0 0;font-size:13.5px;color:var(--muted);
  word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card-actions .btn{font-size:13px;padding:6px 12px}
.btn.ai{background:rgba(255,217,61,.5);box-shadow:2px 2px 0 var(--marker-yellow)}
.btn.ai:hover{box-shadow:4px 4px 0 var(--marker-red)}

/* 关联灵感展示 */
.card-links{
  margin-top:12px;padding-top:10px;
  border-top:1.5px dashed var(--muted);
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);
}
.card-links__label{font-weight:700}
.link-chip{
  font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;
  padding:1px 7px;border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
  background:rgba(78,205,196,.35);transform:rotate(1deg);
  transition:box-shadow .18s ease,transform .18s ease,background .18s ease;
}
.link-chip:hover{box-shadow:2px 2px 0 var(--marker-teal);transform:rotate(1deg) translate(1px,1px)}

.empty{
  padding:54px 20px;text-align:center;
  color:var(--muted);font-size:13.5px;
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  background:var(--paper);
  box-shadow:4px 4px 0 var(--marker-teal);
  animation:fadeInUp .3s ease both
}
.empty::before{content:"✏️ ";font-size:16px}
.foot{margin-top:34px;text-align:center;font-size:12px;color:var(--muted)}

.list.fade .card{animation:fadeInUp .26s ease both}
.list.fade .card:nth-child(2){animation-delay:.03s}
.list.fade .card:nth-child(3){animation-delay:.06s}
.list.fade .card:nth-child(4){animation-delay:.09s}
.list.fade .card:nth-child(n+5){animation-delay:.12s}

/* 手绘纸飞机 */
.paper-plane{
  position:fixed;z-index:90;
  width:46px;height:46px;
  margin:-23px 0 0 -23px;
  pointer-events:none;
  will-change:transform;
  transform:rotate(var(--r0,-12deg));
}
.paper-plane svg{width:100%;height:100%;display:block;overflow:visible}
.paper-plane .p-body{
  fill:var(--paper);stroke:var(--ink);stroke-width:2.5;
  stroke-linejoin:round;stroke-dasharray:4 2;
}
.paper-plane .p-fold{
  fill:none;stroke:var(--ink);stroke-width:2;
  stroke-linecap:round;stroke-dasharray:4 2;
}
.paper-plane.fly{animation:flyPlane .8s cubic-bezier(.4,.03,.7,.5) forwards}
@keyframes flyPlane{
  0%{transform:translate(0,0) rotate(var(--r0,-12deg)) scale(1);opacity:1}
  35%{transform:translate(var(--x1),var(--y1)) rotate(-16deg) scale(.94);opacity:1}
  72%{transform:translate(var(--x2),var(--y2)) rotate(-2deg) scale(.72);opacity:.95}
  100%{transform:translate(var(--dx),var(--dy)) rotate(14deg) scale(.25);opacity:.25}
}

/* 小怪物 */
.monster{
  position:fixed;right:18px;bottom:16px;width:124px;
  pointer-events:none;z-index:50;
}
.monster-svg{width:100%;height:auto;display:block;transform-origin:50% 80%;
  animation:breathe 2.8s ease-in-out infinite}
.m-head{fill:var(--paper);stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.m-ear{fill:var(--paper);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.m-eye-open{opacity:0;transition:opacity .18s ease}
.m-eye-sleep{opacity:1;transition:opacity .18s ease}
.monster.awake .m-eye-open{opacity:1}
.monster.awake .m-eye-sleep{opacity:0}
.m-eye-white{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.m-pupil{fill:var(--ink)}
.m-eye-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.m-blush{fill:var(--marker-red);opacity:.45}
.m-mouth-closed{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;transition:opacity .18s ease}
.m-mouth-open{fill:#f2a9a9;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;opacity:0;transition:opacity .18s ease}
.monster.awake .m-mouth-closed{opacity:0}
.monster.awake .m-mouth-open{opacity:1}
.monster.chewing .monster-svg{animation:chew .42s ease-in-out infinite}
.zz{position:absolute;top:-4px;right:2px;font-size:15px;font-weight:700;color:var(--muted);
  font-style:italic;transition:opacity .2s ease}
.monster.awake .zz{opacity:0}
.monster-thought{
  position:absolute;bottom:100%;left:50%;
  padding:6px 10px;font-size:22px;line-height:1;
  background:var(--paper);border:var(--border-w) dashed var(--ink);border-radius:50%;
  box-shadow:2px 2px 0 var(--marker-yellow);
  opacity:0;transform:translateX(-50%) scale(.6);transform-origin:bottom center;
}
.monster-thought.show{animation:thoughtPop .5s ease both}
.monster-status{
  position:absolute;bottom:100%;right:-6px;margin-bottom:10px;
  padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink);
  background:rgba(255,217,61,.6);
  border:2px dashed var(--ink);border-radius:var(--radius-sm);
  box-shadow:2px 2px 0 var(--marker-teal);
  opacity:0;transform:translateY(6px) rotate(-4deg);
  transition:opacity .2s ease,transform .2s ease;
}
.monster-status.show{opacity:1;transform:translateY(0) rotate(-4deg)}

/* 自定义弹窗（便签纸） */
.modal-mask{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  opacity:0;
  transition:opacity .22s ease;
}
.modal-mask.show{opacity:1}
.modal-card{
  position:relative;
  width:100%;max-width:360px;
  background:var(--paper);
  border:var(--border-w) dashed var(--ink);
  border-radius:var(--radius-sm);
  box-shadow:6px 6px 0 var(--marker-teal);
  padding:24px 20px 18px;
  transform:rotate(-1deg) scale(.9);
  opacity:0;
  transition:transform .22s ease,opacity .22s ease;
}
.modal-card--wide{max-width:440px}
.modal-mask.show .modal-card{transform:rotate(-1deg) scale(1);opacity:1}
.modal-card::after{content:"";position:absolute;top:-9px;left:50%;width:66px;height:17px;
  transform:translateX(-50%) rotate(-3deg);background:rgba(255,217,61,.72);
  border-left:1px dashed rgba(44,44,44,.3);border-right:1px dashed rgba(44,44,44,.3)}
.modal-title{margin:0 0 10px;font-size:17px;font-weight:700;font-style:italic;transform:rotate(-.4deg)}
.modal-text{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.6}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.modal-confirm{font-weight:700}

/* 关联选择列表 */
.link-list{
  max-height:46vh;overflow-y:auto;
  margin:0 0 16px;padding-right:2px;
  display:flex;flex-direction:column;gap:8px;
}
.link-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
  background:var(--paper-2);
  cursor:pointer;
  transition:box-shadow .18s ease,transform .18s ease,background .18s ease;
}
.link-item:hover{box-shadow:2px 2px 0 var(--marker-teal);transform:translate(1px,1px)}
.link-item input[type=checkbox]{
  width:16px;height:16px;flex:none;
  accent-color:var(--marker-red);cursor:pointer;
}
.link-item__id{font-weight:700;font-size:12.5px;flex:none}
.link-item__title{flex:1;min-width:0;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-empty{
  padding:20px 10px;text-align:center;font-size:12.5px;color:var(--muted);
  border:1.5px dashed var(--ink);border-radius:var(--radius-sm);
}

/* 灵感星空（夜间手账） */
.sky-view{
  position:relative;
  max-width:1000px;margin:0 auto;
  padding:8px 20px 24px;
  height:520px;
}
.sky-canvas{
  display:block;width:100%;height:100%;
  background:#1a1c2c;
  border:var(--border-w) dashed rgba(255,254,245,.4);
  border-radius:var(--radius-sm);
  box-shadow:6px 6px 0 rgba(78,205,196,.35);
}
.sky-hint{
  position:absolute;left:34px;top:18px;
  font-size:12px;font-style:italic;letter-spacing:.5px;
  color:rgba(255,254,245,.55);
  pointer-events:none;
  text-shadow:0 1px 0 rgba(0,0,0,.45);
}

/* 星空模式下的纸张/顶部变体 */
body.sky-mode{background-color:#1a1c2c;background-image:none}
body.sky-mode .top{background:#1a1c2c;border-bottom-color:rgba(255,254,245,.22)}
body.sky-mode h1,body.sky-mode .sub{color:#f2ead6}
body.sky-mode h1::after{background:var(--marker-teal)}
body.sky-mode .gear{
  color:#f2ead6;border-color:rgba(255,254,245,.45);
  background:rgba(255,255,255,.06);
  box-shadow:2px 2px 0 rgba(78,205,196,.6);
}
body.sky-mode .gear:hover{box-shadow:4px 4px 0 rgba(255,107,107,.7)}
body.sky-mode .view-tab{
  color:rgba(242,234,214,.62);
  border-color:rgba(255,254,245,.32);
  background:rgba(255,255,255,.05);
  box-shadow:none;
}
body.sky-mode .view-tab:hover{color:#f2ead6;background:rgba(255,255,255,.1)}
body.sky-mode .view-tab.active{
  color:#1a1c2c;background:var(--marker-yellow);
  border-color:var(--marker-yellow);
  box-shadow:2px 2px 0 var(--marker-teal);
}
body.sky-mode .monster{display:none}

@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.8deg)}}
@keyframes chew{
  0%,100%{transform:translateY(0) scale(1,1)}
  15%{transform:translateY(-7px) scale(1.02,.95)}
  30%{transform:translateY(2px) scale(.98,1.05)}
  45%{transform:translateY(-5px) scale(1.01,.96)}
  60%{transform:translateY(1px) scale(.99,1.03)}
  75%{transform:translateY(-3px) scale(1,.98)}
}
@keyframes thoughtPop{
  0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.5)}
  60%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.1)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}

@media (max-width:520px){
  .monster{width:92px;right:10px;bottom:10px}
  main{padding-bottom:120px}
  .sky-view{padding:6px 12px 18px}
  .sky-hint{left:22px;top:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <div>
      <h1>收藏消化助手</h1>
      <p class="sub">主动投递 · 本地存储 · 用完即走</p>
    </div>
    <button class="btn gear" id="settingsToggle">⚙ AI 设置</button>
  </div>
  <div class="view-switch" id="viewSwitch">
    <button class="view-tab active" data-view="list">📋 手账列表</button>
    <button class="view-tab" data-view="sky">🌌 灵感星空</button>
  </div>
</header>

<main class="wrap" id="listView">
  <section class="compose">
    <div class="field">
      <input id="input" type="text" placeholder="粘贴链接，或写下想消化的内容…" autocomplete="off" spellcheck="false">
      <button id="submit" class="btn primary" disabled>投递</button>
    </div>
    <p class="hint">数据仅保存在本机浏览器；只有你点击「AI 提炼」时，该条内容才会发送给你自己配置的模型服务。</p>
  </section>

  <section class="settings" id="settings" hidden>
    <div class="settings-head">
      <strong>AI 提炼设置</strong>
      <span class="settings-tip">兼容 OpenAI 格式接口，配置仅存本机 localStorage</span>
    </div>
    <label class="field-row">
      <span>API 地址</span>
      <input id="cfgBase" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false">
    </label>
    <label class="field-row">
      <span>模型名称</span>
      <input id="cfgModel" type="text" placeholder="gpt-4o-mini" autocomplete="off" spellcheck="false">
    </label>
    <label class="field-row">
      <span>API Key</span>
      <input id="cfgKey" type="text" placeholder="sk-..." autocomplete="off" spellcheck="false">
    </label>
    <div class="settings-actions">
      <button class="btn primary" id="cfgSave">保存配置</button>
      <button class="btn" id="cfgClear">清空 Key</button>
      <span class="settings-state" id="cfgState"></span>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="pending">待消化<i class="count" data-count="pending">0</i></button>
    <button class="tab" data-tab="done">已消化<i class="count" data-count="done">0</i></button>
    <button class="tab" data-tab="archived">归档<i class="count" data-count="archived">0</i></button>
  </nav>

  <section class="list" id="list"></section>

  <p class="foot">数据保存在本机 localStorage，清除浏览器数据会一并清除。</p>
</main>

<section class="sky-view" id="skyView" hidden>
  <canvas class="sky-canvas" id="skyCanvas"></canvas>
  <div class="sky-hint">✨ 光点会自己慢慢游荡</div>
</section>

<div class="monster" id="monster" aria-hidden="true">
  <div class="monster-thought" id="monsterThought">💡</div>
  <div class="monster-status" id="monsterStatus">小怪物正在消化…</div>
  <span class="zz">z z</span>
  <svg class="monster-svg" viewBox="0 0 140 140" role="img" aria-label="手绘小怪物">
    <path class="m-ear" d="M40 20 L32 2 L54 14 Z"/>
    <path class="m-ear" d="M100 20 L110 2 L86 14 Z"/>
    <path class="m-head" d="M70 12 C104 10 126 34 128 66 C130 98 110 126 74 128 C40 130 14 108 12 74 C10 40 34 14 70 12 Z"/>
    <g class="m-eye-open">
      <circle class="m-eye-white" cx="52" cy="62" r="12"/>
      <circle class="m-eye-white" cx="92" cy="62" r="12"/>
      <circle class="m-pupil" cx="54" cy="64" r="5.5"/>
      <circle class="m-pupil" cx="90" cy="64" r="5.5"/>
    </g>
    <g class="m-eye-sleep">
      <path class="m-eye-line" d="M40 62 Q52 72 64 62"/>
      <path class="m-eye-line" d="M80 62 Q92 72 104 62"/>
    </g>
    <ellipse class="m-blush" cx="34" cy="88" rx="9" ry="6"/>
    <ellipse class="m-blush" cx="108" cy="88" rx="9" ry="6"/>
    <path class="m-mouth-closed" d="M52 92 Q70 104 88 92"/>
    <path class="m-mouth-open" d="M50 88 Q70 76 90 88 Q92 112 70 116 Q48 112 50 88 Z"/>
  </svg>
</div>

<div class="modal-mask" id="modalMask" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 class="modal-title" id="modalTitle">⚠️ 确定要销毁这张卡片吗？</h3>
    <p class="modal-text">删除后无法恢复，这张卡片会从本机彻底移除。</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn danger modal-confirm" id="modalConfirm">确定删除</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="linkMask" hidden>
  <div class="modal-card modal-card--wide" role="dialog" aria-modal="true" aria-labelledby="linkTitle">
    <h3 class="modal-title" id="linkTitle">把这缕灵感连接到...</h3>
    <p class="modal-text" id="linkSubtitle"></p>
    <div class="link-list" id="linkList"></div>
    <div class="modal-actions">
      <button class="btn" id="linkCancel">取消</button>
      <button class="btn primary" id="linkSave">🔗 保存关联</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY_CARDS='favorite_digester_cards';
  var KEY_META='favorite_digester_meta';
  var KEY_AI='favorite_digester_ai';
  var VERSION=2;
  var REQUEST_TIMEOUT=60000;
  var MAX_INPUT=4000;
  var SYSTEM_PROMPT='你是收藏内容消化助手。请用中文提炼这段收藏内容的要点与可用结论，2-3 句、不超过 120 字，不要客套话，直接输出结论。';
  var STATUS_TEXT={pending:'待消化',done:'已消化',archived:'归档'};
  var EMPTY_TEXT={
    pending:'还没有待消化的内容，投递第一条吧。',
    done:'还没有已消化的内容，慢慢来。',
    archived:'归档区是空的，这里存放你暂时不想处理的内容。'
  };

  var state={
    cards:[],
    meta:{seqCounter:1,version:VERSION},
    ai:{baseUrl:'',model:'',apiKey:''}
  };
  var tab='pending';

  var list=document.getElementById('list');
  var tabs=document.getElementById('tabs');
  var input=document.getElementById('input');
  var submitBtn=document.getElementById('submit');
  var settings=document.getElementById('settings');
  var settingsToggle=document.getElementById('settingsToggle');
  var cfgBase=document.getElementById('cfgBase');
  var cfgModel=document.getElementById('cfgModel');
  var cfgKey=document.getElementById('cfgKey');
  var cfgSave=document.getElementById('cfgSave');
  var cfgClear=document.getElementById('cfgClear');
  var cfgState=document.getElementById('cfgState');

  var monster=document.getElementById('monster');
  var monsterStatus=document.getElementById('monsterStatus');
  var monsterThought=document.getElementById('monsterThought');
  var modalMask=document.getElementById('modalMask');
  var modalCancel=document.getElementById('modalCancel');
  var modalConfirm=document.getElementById('modalConfirm');
  var linkMask=document.getElementById('linkMask');
  var linkList=document.getElementById('linkList');
  var linkSubtitle=document.getElementById('linkSubtitle');
  var linkCancel=document.getElementById('linkCancel');
  var linkSave=document.getElementById('linkSave');
  var pendingDeleteId=null;
  var pendingLinkId=null;
  var modalHideTimer=null;
  var linkHideTimer=null;
  var popTimer=null;
  var delivering=false;
  var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var viewSwitch=document.getElementById('viewSwitch');
  var listView=document.getElementById('listView');
  var skyView=document.getElementById('skyView');
  var canvas=document.getElementById('skyCanvas');
  var ctx=canvas.getContext('2d');
  var view='list';
  var particles=[];
  var noisePattern=null;
  var animId=null;
  var worldW=0;
  var worldH=0;
  var COLORS=['#4ecdc4','#ff6b6b','#ffd93d'];

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  function pad2(n){return String(n).padStart(2,'0');}
  function pad3(n){return String(n).padStart(3,'0');}
  function shorten(s,n){
    s=String(s).replace(/\s+/g,' ').trim();
    return s.length>n?s.slice(0,n)+'…':s;
  }
  function hostOf(v){
    try{
      var h=new URL(v).hostname.replace(/^www\./,'');
      return h||shorten(v,40);
    }catch(e){return shorten(v,40);}
  }
  function relTime(ts){
    ts=Number(ts)||0;
    var diff=Date.now()-ts;
    if(diff<60000)return '刚刚';
    var min=Math.floor(diff/60000);
    if(min<60)return min+'分钟前';
    var hour=Math.floor(min/60);
    if(hour<24)return hour+'小时前';
    var day=Math.floor(hour/24);
    if(day<30)return day+'天前';
    var d=new Date(ts);
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function isValidCard(c){
    return c&&typeof c==='object'&&typeof c.id==='string'&&typeof c.content==='string'
      &&STATUS_TEXT[c.status]!==undefined;
  }
  function chatEndpoint(base){
    var b=String(base).trim().replace(/\/+$/,'');
    return /\/chat\/completions$/.test(b)?b:b+'/chat/completions';
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

  function load(){
    try{
      var rawCards=localStorage.getItem(KEY_CARDS);
      var rawMeta=localStorage.getItem(KEY_META);
      var rawAi=localStorage.getItem(KEY_AI);
      var cards=rawCards?JSON.parse(rawCards):[];
      var meta=rawMeta?JSON.parse(rawMeta):null;
      var ai=rawAi?JSON.parse(rawAi):null;
      state.cards=Array.isArray(cards)?cards.filter(isValidCard).map(function(c){
        return {
          id:c.id,
          seq:Number(c.seq)||0,
          type:c.type==='link'?'link':'text',
          content:c.content,
          title:typeof c.title==='string'&&c.title?c.title:(c.type==='link'?hostOf(c.content):shorten(c.content,40)),
          status:c.status,
          createdAt:Number(c.createdAt)||Date.now(),
          updatedAt:Number(c.updatedAt)||Number(c.createdAt)||Date.now(),
          aiSummary:typeof c.aiSummary==='string'?c.aiSummary:(typeof c.summary==='string'?c.summary:''),
          aiSummaryAt:Number(c.aiSummaryAt)||Number(c.summaryAt)||0,
          userNote:typeof c.userNote==='string'?c.userNote:'',
          tags:Array.isArray(c.tags)?c.tags:[],
          linkedIds:Array.isArray(c.linkedIds)?c.linkedIds:[]
        };
      }):[];
      state.meta=(meta&&typeof meta==='object')
        ?{seqCounter:Number(meta.seqCounter)||1,version:Number(meta.version)||VERSION}
        :{seqCounter:1,version:VERSION};
      state.ai=(ai&&typeof ai==='object')
        ?{baseUrl:String(ai.baseUrl||''),model:String(ai.model||''),apiKey:String(ai.apiKey||'')}
        :{baseUrl:'',model:'',apiKey:''};
      var maxSeq=state.cards.reduce(function(m,c){return Math.max(m,c.seq);},0);
      if(state.meta.seqCounter<=maxSeq)state.meta.seqCounter=maxSeq+1;
    }catch(e){
      state.cards=[];
      state.meta={seqCounter:1,version:VERSION};
      state.ai={baseUrl:'',model:'',apiKey:''};
    }
  }
  function save(){
    try{
      localStorage.setItem(KEY_CARDS,JSON.stringify(state.cards));
      localStorage.setItem(KEY_META,JSON.stringify(state.meta));
    }catch(e){}
  }
  function saveAI(){
    try{localStorage.setItem(KEY_AI,JSON.stringify(state.ai));}catch(e){}
  }

  function fillSettings(){
    cfgBase.value=state.ai.baseUrl;
    cfgModel.value=state.ai.model;
    cfgKey.value=state.ai.apiKey;
  }
  function openSettings(focusEmpty){
    settings.hidden=false;
    fillSettings();
    if(!focusEmpty)return;
    var target=!state.ai.baseUrl?cfgBase:(!state.ai.model?cfgModel:cfgKey);
    target.focus();
  }
  function toggleSettings(){
    if(settings.hidden){openSettings(false);}else{settings.hidden=true;}
  }
  function setConfigState(msg){cfgState.textContent=msg;}

  /* ---------- 小怪物状态 ---------- */
  function monsterReset(){
    clearTimeout(popTimer);
    monster.classList.remove('awake','chewing');
    monsterThought.classList.remove('show');
    monsterStatus.classList.remove('show');
  }
  function monsterWake(){monster.classList.add('awake');}
  function monsterChew(on){monster.classList.toggle('chewing',!!on);}
  function monsterSay(text){
    if(text){monsterStatus.textContent=text;monsterStatus.classList.add('show');}
    else{monsterStatus.classList.remove('show');}
  }
  function monsterPop(){
    monsterStatus.classList.remove('show');
    monster.classList.remove('chewing');
    monsterThought.classList.add('show');
    clearTimeout(popTimer);
    popTimer=setTimeout(function(){
      monsterThought.classList.remove('show');
      monster.classList.remove('awake');
    },1800);
  }

  function monsterMouthPoint(){
    var m=monster.getBoundingClientRect();
    return {x:m.left+m.width*0.5,y:m.top+m.height*0.62};
  }

  /* ---------- 手绘纸飞机抛物线 ---------- */
  function spawnPlane(originRect){
    return new Promise(function(resolve){
      if(reduceMotion){setTimeout(resolve,0);return;}
      var target=monsterMouthPoint();
      var sx=originRect.left+originRect.width/2;
      var sy=originRect.top+originRect.height/2;
      var dx=target.x-sx;
      var dy=target.y-sy;
      var lift=Math.max(45,Math.min(110,Math.sqrt(dx*dx+dy*dy)*0.15));
      var cx=dx*0.48;
      var cy=-lift;
      function bez(t){
        var mt=1-t;
        return {x:2*mt*t*cx+t*t*dx, y:2*mt*t*cy+t*t*dy};
      }
      var p1=bez(0.35);
      var p2=bez(0.72);
      var plane=document.createElement('div');
      plane.className='paper-plane';
      plane.setAttribute('aria-hidden','true');
      plane.style.left=sx+'px';
      plane.style.top=sy+'px';
      plane.style.setProperty('--x1',p1.x.toFixed(1)+'px');
      plane.style.setProperty('--y1',p1.y.toFixed(1)+'px');
      plane.style.setProperty('--x2',p2.x.toFixed(1)+'px');
      plane.style.setProperty('--y2',p2.y.toFixed(1)+'px');
      plane.style.setProperty('--dx',dx.toFixed(1)+'px');
      plane.style.setProperty('--dy',dy.toFixed(1)+'px');
      plane.style.setProperty('--r0',(Math.atan2(dy,dx)*180/Math.PI-18).toFixed(1)+'deg');
      plane.innerHTML='<svg viewBox="0 0 48 48" aria-hidden="true">'
        +'<path class="p-body" d="M5 25 L44 6 L30 43 L23 28 Z"/>'
        +'<path class="p-fold" d="M23 28 L44 6"/>'
        +'<path class="p-fold" d="M23 28 L20 37"/>'
        +'</svg>';
      document.body.appendChild(plane);
      void plane.offsetWidth;
      plane.classList.add('fly');
      setTimeout(function(){
        if(plane.parentNode)plane.parentNode.removeChild(plane);
        resolve();
      },820);
    });
  }

  async function deliver(raw){
    if(delivering)return;
    var v=raw.trim();
    if(!v)return;
    delivering=true;
    monsterReset();
    monsterWake();
    monsterSay('小怪物正在消化…');
    input.classList.add('sending');
    try{
      await spawnPlane(input.getBoundingClientRect());
      input.classList.remove('sending');
      input.value='';
      submitBtn.disabled=true;
      input.focus();
      monsterChew(true);
      await sleep(reduceMotion? 60 : 850);
      addCard(v);
      monsterChew(false);
      monsterPop();
    }finally{
      input.classList.remove('sending');
      delivering=false;
    }
  }

  /* ---------- 删除确认弹窗 ---------- */
  function openDeleteModal(id){
    pendingDeleteId=id;
    clearTimeout(modalHideTimer);
    modalMask.hidden=false;
    void modalMask.offsetWidth;
    modalMask.classList.add('show');
    modalCancel.focus();
  }
  function closeDeleteModal(){
    if(modalMask.hidden)return;
    pendingDeleteId=null;
    modalMask.classList.remove('show');
    clearTimeout(modalHideTimer);
    modalHideTimer=setTimeout(function(){
      modalMask.hidden=true;
    },260);
  }
  modalCancel.addEventListener('click',closeDeleteModal);
  modalMask.addEventListener('click',function(e){
    if(e.target===modalMask)closeDeleteModal();
  });
  modalConfirm.addEventListener('click',function(){
    var id=pendingDeleteId;
    var cardEl=id?list.querySelector('.card[data-id="'+id+'"]'):null;
    closeDeleteModal();
    if(id)deleteCard(id,cardEl);
  });

  /* ---------- 灵感碰撞：双向绑定核心 ---------- */
  function applyBidirectionalLinks(cards,currentId,selectedIds){
    var selectedSet={};
    selectedIds.forEach(function(id){selectedSet[id]=true;});
    cards.forEach(function(c){
      if(c.id===currentId){
        c.linkedIds=selectedIds.filter(function(id){return id!==currentId;});
      }else{
        var has=c.linkedIds.indexOf(currentId)>=0;
        var should=!!selectedSet[c.id];
        if(should&&!has){c.linkedIds.push(currentId);}
        else if(!should&&has){c.linkedIds=c.linkedIds.filter(function(x){return x!==currentId;});}
      }
      c.linkedIds=c.linkedIds.filter(function(x,i,arr){
        return x!==c.id&&arr.indexOf(x)===i;
      });
    });
    return cards;
  }

  function openLinkModal(id){
    pendingLinkId=id;
    var current=state.cards.find(function(c){return c.id===id;});
    if(!current)return;
    var others=state.cards.filter(function(c){return c.id!==id;})
      .sort(function(a,b){return a.seq-b.seq;});
    linkSubtitle.textContent='当前卡片 #'+pad3(current.seq)+'，勾选要连接的灵感（双向生效）。';
    if(!others.length){
      linkList.innerHTML='<div class="link-empty">还没有其他卡片可以连接，先投递几条吧。</div>';
    }else{
      linkList.innerHTML=others.map(function(c){
        var checked=current.linkedIds.indexOf(c.id)>=0?' checked':'';
        return '<label class="link-item">'
          +'<input type="checkbox" value="'+esc(c.id)+'"'+checked+'>'
          +'<span class="link-item__id">#'+pad3(c.seq)+'</span>'
          +'<span class="link-item__title">'+esc(shorten(c.title||c.content,30))+'</span>'
          +'</label>';
      }).join('');
    }
    clearTimeout(linkHideTimer);
    linkMask.hidden=false;
    void linkMask.offsetWidth;
    linkMask.classList.add('show');
    linkCancel.focus();
  }
  function closeLinkModal(){
    if(linkMask.hidden)return;
    pendingLinkId=null;
    linkMask.classList.remove('show');
    clearTimeout(linkHideTimer);
    linkHideTimer=setTimeout(function(){
      linkMask.hidden=true;
    },260);
  }
  function saveLinks(){
    var currentId=pendingLinkId;
    var current=state.cards.find(function(c){return c.id===currentId;});
    if(!current){closeLinkModal();return;}
    var selected=[];
    linkList.querySelectorAll('input[type=checkbox]:checked').forEach(function(cb){
      selected.push(cb.value);
    });
    applyBidirectionalLinks(state.cards,currentId,selected);
    current.updatedAt=Date.now();
    save();
    closeLinkModal();
    render();
  }
  linkCancel.addEventListener('click',closeLinkModal);
  linkMask.addEventListener('click',function(e){
    if(e.target===linkMask)closeLinkModal();
  });
  linkSave.addEventListener('click',saveLinks);

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeDeleteModal();closeLinkModal();}
  });

  /* ---------- 跳转并高亮关联卡片 ---------- */
  function goToCard(id){
    var rec=state.cards.find(function(c){return c.id===id;});
    if(!rec)return;
    if(rec.status!==tab){
      tab=rec.status;
      render();
    }
    requestAnimationFrame(function(){
      var el=list.querySelector('.card[data-id="'+id+'"]');
      if(!el)return;
      el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'center'});
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      setTimeout(function(){el.classList.remove('flash');},1200);
    });
  }

  /* ---------- 灵感星空：画布与光点物理 ---------- */
  function pseudo(v){
    var s=Math.sin(v*12.9898)*43758.5453;
    return s-Math.floor(s);
  }
  function blobPath(x,y,r,seed){
    var n=10;
    var pts=[];
    for(var i=0;i<n;i++){
      var a=(i/n)*Math.PI*2;
      var rr=r*(0.84+0.2*pseudo(seed+i*7.3));
      pts.push({x:x+Math.cos(a)*rr,y:y+Math.sin(a)*rr});
    }
    ctx.beginPath();
    ctx.moveTo((pts[0].x+pts[n-1].x)/2,(pts[0].y+pts[n-1].y)/2);
    for(var k=0;k<n;k++){
      var cur=pts[k];
      var nx=pts[(k+1)%n];
      ctx.quadraticCurveTo(cur.x,cur.y,(cur.x+nx.x)/2,(cur.y+nx.y)/2);
    }
    ctx.closePath();
  }
  function initNoise(){
    var nc=document.createElement('canvas');
    nc.width=160;nc.height=160;
    var g=nc.getContext('2d');
    for(var i=0;i<1800;i++){
      g.fillStyle='rgba(255,254,245,'+(Math.random()*0.05).toFixed(3)+')';
      var s=Math.random()*1.4+0.2;
      g.fillRect(Math.random()*160,Math.random()*160,s,s);
    }
    noisePattern=ctx.createPattern(nc,'repeat');
  }
  function sizeSky(){
    var top=document.querySelector('.top');
    var topH=top?top.getBoundingClientRect().height:120;
    var h=Math.max(360,Math.round(window.innerHeight-topH-40));
    skyView.style.height=h+'px';
    var rect=canvas.getBoundingClientRect();
    var w=Math.max(280,Math.round(rect.width));
    var hh=Math.max(240,Math.round(rect.height));
    var dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(hh*dpr);
    canvas.style.width=w+'px';
    canvas.style.height=hh+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    worldW=w;worldH=hh;
  }
  function buildParticles(){
    if(!worldW||!worldH)return;
    var old={};
    particles.forEach(function(p){old[p.id]=p;});
    var next=[];
    state.cards.forEach(function(c){
      var p=old[c.id];
      if(p){p.seq=c.seq;next.push(p);return;}
      var r=Math.min(26+(c.seq%3)*4,Math.max(14,Math.min(worldW,worldH)/2-8));
      next.push({
        id:c.id,
        seq:c.seq,
        x:r+Math.random()*(worldW-2*r),
        y:r+Math.random()*(worldH-2*r),
        vx:(Math.random()-.5)*.5,
        vy:(Math.random()-.5)*.5,
        r:r,
        seed:Math.random()*1000,
        phase:Math.random()*Math.PI*2,
        color:COLORS[c.seq%COLORS.length]
      });
    });
    particles=next;
  }
  function clampParticles(){
    particles.forEach(function(p){
      p.r=Math.min(p.r,Math.max(14,Math.min(worldW,worldH)/2-8));
      p.x=Math.max(p.r,Math.min(worldW-p.r,p.x));
      p.y=Math.max(p.r,Math.min(worldH-p.r,p.y));
    });
  }
  function stepParticles(){
    var n=particles.length;
    var i,j;
    for(i=0;i<n;i++){
      var p=particles[i];
      p.vx+=(Math.random()-.5)*0.035;
      p.vy+=(Math.random()-.5)*0.035;
    }
    for(i=0;i<n;i++){
      for(j=i+1;j<n;j++){
        var a=particles[i],b=particles[j];
        var dx=b.x-a.x,dy=b.y-a.y;
        var d2=dx*dx+dy*dy;
        var min=a.r+b.r+10;
        if(d2<min*min&&d2>0.01){
          var d=Math.sqrt(d2);
          var f=(min-d)/min*0.12;
          var ux=dx/d,uy=dy/d;
          a.vx-=ux*f;a.vy-=uy*f;
          b.vx+=ux*f;b.vy+=uy*f;
        }
      }
    }
    for(i=0;i<n;i++){
      var q=particles[i];
      q.vx*=0.988;q.vy*=0.988;
      var sp=Math.sqrt(q.vx*q.vx+q.vy*q.vy);
      var maxSp=0.6;
      if(sp>maxSp){q.vx=q.vx/sp*maxSp;q.vy=q.vy/sp*maxSp;sp=maxSp;}
      if(sp<0.12){
        var ang=Math.random()*Math.PI*2;
        q.vx+=Math.cos(ang)*0.05;
        q.vy+=Math.sin(ang)*0.05;
      }
      q.x+=q.vx;q.y+=q.vy;
      if(q.x<q.r){q.x=q.r;q.vx=Math.abs(q.vx);}
      if(q.x>worldW-q.r){q.x=worldW-q.r;q.vx=-Math.abs(q.vx);}
      if(q.y<q.r){q.y=q.r;q.vy=Math.abs(q.vy);}
      if(q.y>worldH-q.r){q.y=worldH-q.r;q.vy=-Math.abs(q.vy);}
    }
  }
  function drawParticle(p,t){
    var pulse=0.72+0.28*Math.sin(t*0.0016+p.phase);
    ctx.save();
    ctx.shadowBlur=18*pulse;
    ctx.shadowColor=p.color;
    ctx.lineWidth=2;
    ctx.strokeStyle=p.color;
    ctx.fillStyle='rgba(26,28,44,.55)';
    blobPath(p.x,p.y,p.r,p.seed);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font='700 11.5px "Comic Sans MS","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,254,245,.92)';
    ctx.fillText('#'+pad3(p.seq),p.x,p.y+0.5);
    ctx.restore();
  }
  function drawSky(){
    if(!worldW||!worldH)return;
    var t=performance.now();
    ctx.clearRect(0,0,worldW,worldH);
    ctx.fillStyle='#1a1c2c';
    ctx.fillRect(0,0,worldW,worldH);
    if(noisePattern){
      ctx.fillStyle=noisePattern;
      ctx.fillRect(0,0,worldW,worldH);
    }
    for(var i=0;i<particles.length;i++)drawParticle(particles[i],t);
  }
  function loop(){
    if(view!=='sky')return;
    stepParticles();
    drawSky();
    animId=requestAnimationFrame(loop);
  }
  function startLoop(){
    stopLoop();
    if(reduceMotion){drawSky();return;}
    animId=requestAnimationFrame(loop);
  }
  function stopLoop(){
    if(animId){cancelAnimationFrame(animId);animId=null;}
  }
  function updateViewSwitch(){
    var btns=viewSwitch.querySelectorAll('[data-view]');
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle('active',btns[i].dataset.view===view);
    }
  }
  function setView(next){
    if(next===view)return;
    view=next;
    if(view==='sky'){
      listView.hidden=true;
      document.body.classList.add('sky-mode');
      skyView.hidden=false;
      sizeSky();
      buildParticles();
      startLoop();
    }else{
      stopLoop();
      skyView.hidden=true;
      document.body.classList.remove('sky-mode');
      listView.hidden=false;
    }
    updateViewSwitch();
  }
  viewSwitch.addEventListener('click',function(e){
    var b=e.target.closest('[data-view]');
    if(!b)return;
    setView(b.dataset.view);
  });
  window.addEventListener('resize',function(){
    if(view!=='sky')return;
    sizeSky();
    clampParticles();
    if(reduceMotion)drawSky();
  });
  document.addEventListener('visibilitychange',function(){
    if(view!=='sky')return;
    if(document.hidden){stopLoop();}
    else{startLoop();}
  });

  /* ---------- 卡片渲染 ---------- */
  function cardHTML(c){
    var actions=[];
    if(c.status==='pending'){
      actions.push('<button class="btn" data-act="done">✅ 已消化</button>');
      actions.push('<button class="btn" data-act="archive">📦 归档</button>');
    }else{
      actions.push('<button class="btn" data-act="restore">↩ 恢复</button>');
    }
    actions.push('<button class="btn" data-act="note">📝 '+(c.userNote?'编辑笔记':'写笔记')+'</button>');
    actions.push('<button class="btn ai" data-act="ai">✨ '+(c.aiSummary?'重新提炼':'AI 提炼')+'</button>');
    actions.push('<button class="btn link" data-act="link">🔗 灵感碰撞</button>');
    actions.push('<button class="btn danger" data-act="delete">🗑️ 删除</button>');

    var titleHTML;
    if(c.type==='link'){
      titleHTML='<a href="'+esc(c.content)+'" target="_blank" rel="noopener noreferrer">'+esc(c.title)+'</a>';
    }else{
      titleHTML=esc(c.title);
    }

    var tagsHTML='';
    if(Array.isArray(c.tags)&&c.tags.length){
      tagsHTML='<div class="card-tags">'+c.tags.map(function(t){
        return '<span class="tag-chip">#'+esc(t)+'</span>';
      }).join('')+'</div>';
    }

    var aiHTML=c.aiSummary
      ?'<div class="ai-summary">'+esc(c.aiSummary)+'</div>'
      :'<div class="ai-summary" hidden></div>';
    var noteHTML=c.userNote
      ?'<div class="user-note">'+esc(c.userNote)+'</div>'
      :'';

    var linkedCards=(c.linkedIds||[]).map(function(id){
      return state.cards.find(function(x){return x.id===id;});
    }).filter(Boolean).sort(function(a,b){return a.seq-b.seq;});

    var linksHTML='';
    if(linkedCards.length){
      linksHTML='<div class="card-links">'
        +'<span class="card-links__label">🔗 关联灵感：</span>'
        +linkedCards.map(function(t){
          return '<a href="#" class="link-chip" data-goto="'+esc(t.id)+'">#'+pad3(t.seq)+'</a>';
        }).join('')
        +'</div>';
    }

    var showContent=!(c.type==='text'&&c.content.length<=40);

    return '<article class="card" data-id="'+esc(c.id)+'">'
      +'<div class="card-head">'
        +'<span class="seq">#'+pad3(c.seq)+'</span>'
        +'<span class="badge '+c.status+'">'+STATUS_TEXT[c.status]+'</span>'
        +'<span class="time" data-ts="'+c.createdAt+'">'+relTime(c.createdAt)+'</span>'
      +'</div>'
      +'<h3 class="card-title" title="'+esc(c.title)+'">'+titleHTML+'</h3>'
      +tagsHTML
      +aiHTML
      +noteHTML
      +(showContent?'<p class="card-content">'+esc(c.content)+'</p>':'')
      +linksHTML
      +'<div class="card-actions">'+actions.join('')+'</div>'
      +'</article>';
  }

  function render(){
    var counts={pending:0,done:0,archived:0};
    state.cards.forEach(function(c){counts[c.status]++;});
    tabs.querySelectorAll('.count').forEach(function(el){
      el.textContent=counts[el.dataset.count]||0;
    });
    tabs.querySelectorAll('.tab').forEach(function(el){
      el.classList.toggle('active',el.dataset.tab===tab);
    });

    var items=state.cards.filter(function(c){return c.status===tab;})
      .sort(function(a,b){return b.createdAt-a.createdAt;});

    if(!items.length){
      list.classList.remove('fade');
      list.innerHTML='<div class="empty">'+EMPTY_TEXT[tab]+'</div>';
      return;
    }
    list.innerHTML=items.map(cardHTML).join('');
    list.classList.remove('fade');
    void list.offsetWidth;
    list.classList.add('fade');
  }

  function addCard(raw){
    var v=raw.trim();
    if(!v)return;
    var isLink=/^https?:\/\/\S+$/i.test(v);
    var card={
      id:'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      seq:state.meta.seqCounter++,
      type:isLink?'link':'text',
      content:v,
      title:isLink?hostOf(v):shorten(v,40),
      status:'pending',
      createdAt:Date.now(),
      updatedAt:Date.now(),
      aiSummary:'',
      aiSummaryAt:0,
      userNote:'',
      tags:[],
      linkedIds:[]
    };
    state.cards.unshift(card);
    save();
    tab='pending';
    render();
  }

  function deleteCard(id,cardEl){
    var idx=-1;
    for(var i=0;i<state.cards.length;i++){
      if(state.cards[i].id===id){idx=i;break;}
    }
    if(idx<0)return;
    state.cards.splice(idx,1);
    state.cards.forEach(function(c){
      if(Array.isArray(c.linkedIds)){
        c.linkedIds=c.linkedIds.filter(function(x){return x!==id;});
      }
    });
    save();
    if(cardEl){
      cardEl.classList.add('leaving');
      setTimeout(function(){render();},180);
    }else{
      render();
    }
  }

  function describeError(err){
    var msg=err&&err.message?err.message:'请求被中断';
    if(err&&err.name==='AbortError')return '请求超时（'+Math.round(REQUEST_TIMEOUT/1000)+'秒）';
    if(/failed to fetch|networkerror|load failed/i.test(msg))return '网络或跨域被拒绝，请确认该 API 允许浏览器直接访问（CORS）';
    return msg;
  }

  async function runAI(rec,cardEl,btn){
    if(!state.ai.baseUrl||!state.ai.model||!state.ai.apiKey){
      openSettings(true);
      setConfigState('请先填写并保存 API 地址、模型与 API Key');
      return;
    }
    if(btn.disabled)return;
    var box=cardEl.querySelector('.ai-summary');
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();},REQUEST_TIMEOUT);

    btn.disabled=true;
    btn.classList.add('loading');
    btn.textContent='✨ 提炼中…';

    monsterReset();
    monsterWake();
    monsterSay('小怪物正在消化…');
    cardEl.classList.add('digesting');

    await spawnPlane(btn.getBoundingClientRect());
    monsterChew(true);

    try{
      var res=await fetch(chatEndpoint(state.ai.baseUrl),{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+state.ai.apiKey
        },
        body:JSON.stringify({
          model:state.ai.model,
          temperature:0.3,
          messages:[
            {role:'system',content:SYSTEM_PROMPT},
            {role:'user',content:rec.content.slice(0,MAX_INPUT)}
          ]
        }),
        signal:ctrl.signal
      });

      if(!res.ok){
        var detail='';
        try{detail=(await res.text()).slice(0,160);}catch(e2){}
        throw new Error('HTTP '+res.status+(detail?' · '+detail:''));
      }

      var data=await res.json();
      var text=data&&data.choices&&data.choices[0]&&data.choices[0].message
        ?data.choices[0].message.content:'';
      if(!text||!String(text).trim())throw new Error('模型返回内容为空');

      rec.aiSummary=String(text).trim();
      rec.aiSummaryAt=Date.now();
      save();

      box.hidden=false;
      box.className='ai-summary';
      box.textContent=rec.aiSummary;
      btn.textContent='✨ 重新提炼';
      setConfigState('提炼完成，结果已保存到本机');
    }catch(err){
      box.hidden=false;
      box.className='ai-summary error';
      box.textContent='提炼失败：'+describeError(err)+'（可再次点击重试）';
      btn.textContent='✨ '+(rec.aiSummary?'重新提炼':'AI 提炼');
    }finally{
      clearTimeout(timer);
      btn.disabled=false;
      btn.classList.remove('loading');
      monsterChew(false);
      cardEl.classList.remove('digesting');
      monsterPop();
    }
  }

  function openNoteEditor(cardEl,rec){
    var existing=cardEl.querySelector('.note-editor');
    if(existing){
      existing.querySelector('.note-input').focus();
      return;
    }
    var box=document.createElement('div');
    box.className='note-editor';
    box.innerHTML='<textarea class="note-input" rows="3" placeholder="写下你的总结或想法…"></textarea>'
      +'<div class="note-actions">'
        +'<button class="btn primary" data-note="save">保存</button>'
        +'<button class="btn" data-note="cancel">取消</button>'
      +'</div>';
    var actions=cardEl.querySelector('.card-actions');
    cardEl.insertBefore(box,actions);
    var ta=box.querySelector('.note-input');
    ta.value=rec.userNote||'';
    ta.focus();
    box.querySelector('[data-note="save"]').addEventListener('click',function(){
      rec.userNote=ta.value.trim();
      rec.updatedAt=Date.now();
      save();
      render();
    });
    box.querySelector('[data-note="cancel"]').addEventListener('click',function(){
      box.remove();
    });
  }

  list.addEventListener('click',function(e){
    var goto=e.target.closest('[data-goto]');
    if(goto){
      e.preventDefault();
      goToCard(goto.dataset.goto);
      return;
    }
    var btn=e.target.closest('[data-act]');
    if(!btn)return;
    var cardEl=e.target.closest('.card');
    if(!cardEl)return;
    var id=cardEl.dataset.id;
    var rec=state.cards.find(function(c){return c.id===id;});
    if(!rec)return;

    var act=btn.dataset.act;
    if(act==='ai'){
      if(btn.disabled)return;
      runAI(rec,cardEl,btn);
      return;
    }
    if(act==='note'){
      openNoteEditor(cardEl,rec);
      return;
    }
    if(act==='link'){
      openLinkModal(id);
      return;
    }
    if(act==='delete'){
      openDeleteModal(id);
      return;
    }
    rec.status=act==='done'?'done':act==='archive'?'archived':'pending';
    rec.updatedAt=Date.now();
    cardEl.classList.add('leaving');
    setTimeout(function(){
      save();
      render();
    },180);
  });

  tabs.addEventListener('click',function(e){
    var t=e.target.closest('.tab');
    if(!t)return;
    tab=t.dataset.tab;
    render();
  });

  settingsToggle.addEventListener('click',toggleSettings);
  cfgSave.addEventListener('click',function(){
    state.ai={
      baseUrl:cfgBase.value.trim().replace(/\/+$/,''),
      model:cfgModel.value.trim(),
      apiKey:cfgKey.value.trim()
    };
    saveAI();
    setConfigState(state.ai.baseUrl&&state.ai.model&&state.ai.apiKey
      ?'配置已保存，可点击卡片上的「AI 提炼」'
      :'已保存，但配置不完整');
  });
  cfgClear.addEventListener('click',function(){
    state.ai.apiKey='';
    saveAI();
    fillSettings();
    setConfigState('API Key 已从本机清除');
  });
  [cfgBase,cfgModel,cfgKey].forEach(function(el){
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter')cfgSave.click();
    });
  });

  input.addEventListener('input',function(){
    submitBtn.disabled=!input.value.trim();
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&input.value.trim()){
      submitBtn.disabled=true;
      deliver(input.value);
    }
  });
  submitBtn.addEventListener('click',function(){
    if(!input.value.trim())return;
    submitBtn.disabled=true;
    deliver(input.value);
  });

  setInterval(function(){
    list.querySelectorAll('.time').forEach(function(el){
      el.textContent=relTime(el.dataset.ts);
    });
  },30000);

  initNoise();
  load();
  render();
})();
</script>
